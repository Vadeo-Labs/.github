name: Bug report
description: Something does not work as expected
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Where
      description: URL or environment, plus browser and device when it is a web issue.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Do not paste secrets, tokens or personal data.
  - type: input
    id: ticket
    attributes:
      label: Ticket
      placeholder: VL-12
