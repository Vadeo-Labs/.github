name: Feature request
description: Propose an improvement or a new capability
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is blocked or slowed down, and by what. Describe the problem before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The shortest way to solve it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we will know it works.
  - type: input
    id: ticket
    attributes:
      label: Ticket
      placeholder: VL-12
